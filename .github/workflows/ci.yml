name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  root:
    name: shared / Playwright 版(テスト・型チェック)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # shared/*.dom.test.ts が実ブラウザを使う
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

  extension:
    name: Chrome 拡張(型チェック・ビルド)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # 公開ボタンを押すコードが紛れ込んでいないかの最低限の検査:
      # クリックは必ず safeClick を通す(素の .click() は safeClick の中にしか無い)
      - name: 素の .click() が safeClick の外に無いことを確認
        run: |
          hits=$(grep -n "\.click()" src/content.ts | grep -v "el\.click();" || true)
          if [ -n "$hits" ]; then echo "safeClick を通らない click があります:"; echo "$hits"; exit 1; fi
